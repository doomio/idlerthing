# CodeQL analysis of the languages this repository ships: Go (the binary),
# the JavaScript in the web assets, and the Actions workflows themselves.
#
# This is an ADVANCED configuration, so GitHub's Code Scanning *default setup*
# must stay disabled for the repository. With default setup enabled, code
# scanning rejects the SARIF uploaded here — "CodeQL analyses from advanced
# configurations cannot be processed when the default setup is enabled" — and
# the analysis shows as failed even though it ran. Repo Settings -> Security
# and analysis -> Code scanning -> Default: disabled.
#
# Actions are pinned to full commit SHAs, as in ci.yml and release.yml (a
# mutable tag can be repointed at malicious code); the trailing comment
# records the tag for Dependabot.
name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '16 17 * * 5'

# Least privilege: the jobs that need more declare it themselves.
permissions:
  contents: read

# A new push to the same ref supersedes the previous analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # autobuild needs a Go matching go.mod's toolchain line; without this
      # the runner falls back to its preinstalled Go and downloads the pinned
      # toolchain on every analysis.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
